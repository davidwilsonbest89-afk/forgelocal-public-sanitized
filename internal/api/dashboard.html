<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BrowseForge</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,sans-serif;background:#1e1e2e;color:#cdd6f4;min-height:100vh}
.header{padding:16px 24px;border-bottom:1px solid #45475a;display:flex;align-items:center;gap:16px}
.header h1{font-size:18px;font-weight:600}
.header .status{font-size:12px;color:#a6e3a1}
.header .spacer{flex:1}
.lang-select{padding:6px 8px;background:#2a2a3c;border:1px solid #45475a;border-radius:6px;color:#cdd6f4;font-size:12px}
.toolbar{padding:12px 24px;display:flex;gap:8px;border-bottom:1px solid #313244}
button{padding:8px 16px;background:#45475a;border:none;border-radius:6px;color:#cdd6f4;cursor:pointer;font-size:13px}
button:hover{background:#585b70}
button.primary{background:#89b4fa;color:#1e1e2e}
button.danger{background:#f38ba8;color:#1e1e2e}
.grid{padding:24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.card{background:#2a2a3c;border:1px solid #45475a;border-radius:10px;padding:16px;position:relative}
.card .name{font-size:15px;font-weight:600;margin-bottom:4px}
.card .meta{font-size:12px;color:#6c7086;margin-bottom:12px}
.card .engine{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;background:#313244}
.card .engine.firefox{color:#f9e2af}
.card .engine.chromium{color:#89b4fa}
.card .fp{font-size:11px;color:#6c7086;margin:8px 0;line-height:1.6}
.card .fp span{color:#a6adc8}
.card .actions{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.card .actions button{padding:6px 12px;font-size:12px}
.card .thumb{margin-top:8px;border-radius:6px;max-width:100%;border:1px solid #45475a}
.badge{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.badge.active{background:#a6e3a1}
.badge.inactive{background:#6c7086}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;align-items:center;justify-content:center}
.modal-bg.show{display:flex}
.modal{background:#2a2a3c;border-radius:12px;padding:24px;width:420px;max-height:80vh;overflow-y:auto}
.modal h2{margin-bottom:16px;font-size:16px}
.modal label{display:block;font-size:12px;color:#a6adc8;margin:8px 0 4px}
.modal input,.modal select{width:100%;padding:8px;background:#1e1e2e;border:1px solid #45475a;border-radius:6px;color:#cdd6f4;font-size:13px}
.modal .btn-row{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
#toast{position:fixed;bottom:24px;right:24px;padding:12px 20px;background:#313244;border-radius:8px;font-size:13px;display:none;z-index:200}
.login-overlay{position:fixed;inset:0;background:#1e1e2e;z-index:300;display:flex;align-items:center;justify-content:center}
.login-box{text-align:center;width:360px}
.login-box h1{margin-bottom:8px}
.login-box p{font-size:13px;color:#6c7086;margin-bottom:16px}
.login-box input{width:100%;padding:10px;background:#2a2a3c;border:1px solid #45475a;border-radius:6px;color:#cdd6f4;font-size:14px;margin-bottom:8px}
.login-box .error{color:#f38ba8;font-size:12px;margin-bottom:8px;display:none}
.login-box button{width:100%;padding:10px}
.empty-state{text-align:center;padding:80px 24px;color:#6c7086}
.empty-state h2{color:#cdd6f4;margin-bottom:8px}
.empty-state p{margin-bottom:16px;font-size:14px}
</style>
</head>
<body>

<!-- Login overlay -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <h1>🦊 BrowseForge</h1>
    <p><span data-i18n="loginPrompt">Enter API Token</span><br><code>./BrowseForge token</code> <span data-i18n="loginOr">or check</span> <code>data/.api-token</code></p>
    <input type="password" id="loginToken" placeholder="API Token" autofocus>
    <div class="error" id="loginError" data-i18n="invalidToken">Invalid token. Please try again.</div>
    <button class="primary" onclick="submitLogin()" data-i18n="login">Log in</button>
  </div>
</div>

<div class="header">
  <h1>🦊 BrowseForge</h1>
  <span class="status" id="status" data-i18n="connecting">Connecting...</span>
  <span class="spacer"></span>
  <select class="lang-select" id="langSelect" aria-label="Language">
    <option value="en">English</option>
    <option value="zh-TW">繁體中文</option>
  </select>
</div>
<div class="toolbar" id="toolbar" style="display:none">
  <button class="primary" onclick="showCreate()" data-i18n="newProfile">+ New Profile</button>
  <button onclick="loadProfiles()" data-i18n="refresh">🔄 Refresh</button>
  <span style="flex:1"></span>
  <button onclick="importProfile()" data-i18n="importProfile">📥 Import Profile</button>
  <button onclick="backupAll()" data-i18n="backupAll">📦 Backup All</button>
  <button onclick="restoreBackup()" data-i18n="restoreBackup">📤 Restore Backup</button>
  <input type="file" id="importFile" accept=".zip" style="display:none" onchange="handleImport(this)">
  <input type="file" id="restoreFile" accept=".zip" style="display:none" onchange="handleRestore(this)">
</div>
<div class="grid" id="grid"></div>

<div class="modal-bg" id="editModal">
  <div class="modal">
    <h2 data-i18n="editProfile">Edit Profile</h2>
    <input type="hidden" id="e-id">
    <label data-i18n="name">Name</label><input id="e-name">
    <label data-i18n="group">Group</label><input id="e-group">
    <label data-i18n="proxyType">Proxy Type</label>
    <select id="e-proxy-type"><option value="" data-i18n="noProxy">No Proxy</option><option value="socks5">SOCKS5</option><option value="http">HTTP</option></select>
    <label>Proxy Host</label><input id="e-proxy-host">
    <label>Proxy Port</label><input id="e-proxy-port" type="number">
    <label data-i18n="proxyUsername">Proxy Username</label><input id="e-proxy-user">
    <label data-i18n="proxyPassword">Proxy Password</label><input id="e-proxy-pass" type="password">
    <div class="btn-row">
      <button onclick="hideEdit()" data-i18n="cancel">Cancel</button>
      <button class="primary" onclick="saveProfile()" data-i18n="save">Save</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="createModal">
  <div class="modal">
    <h2 data-i18n="newProfileTitle">New Profile</h2>
    <label data-i18n="name">Name</label><input id="f-name" placeholder="FB Brand #1">
    <label data-i18n="engine">Engine</label><select id="f-engine"><option value="firefox">🦊 Firefox (Camoufox)</option><option value="chromium">🌐 Chromium (CloakBrowser)</option></select>
    <label data-i18n="group">Group</label><input id="f-group" data-i18n-placeholder="groupPlaceholder" placeholder="Client A">
    <label data-i18n="proxyOptional">Proxy (optional)</label>
    <select id="f-proxy-type"><option value="" data-i18n="noProxy">No Proxy</option><option value="socks5">SOCKS5</option><option value="http">HTTP</option></select>
    <input id="f-proxy-host" placeholder="proxy.example.com" style="margin-top:4px">
    <input id="f-proxy-port" placeholder="1080" type="number" style="margin-top:4px">
    <input id="f-proxy-user" data-i18n-placeholder="usernameOptional" placeholder="Username (optional)" style="margin-top:4px">
    <input id="f-proxy-pass" data-i18n-placeholder="passwordOptional" placeholder="Password (optional)" type="password" style="margin-top:4px">
    <div class="btn-row">
      <button onclick="hideCreate()" data-i18n="cancel">Cancel</button>
      <button class="primary" onclick="createProfile()" data-i18n="create">Create</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const API = '/api';
const LOCALES = {
  en: {
    loginPrompt: 'Enter API Token',
    loginOr: 'or check',
    invalidToken: 'Invalid token. Please try again.',
    enterToken: 'Enter a token',
    login: 'Log in',
    connecting: 'Connecting...',
    offline: 'Offline',
    newProfile: '+ New Profile',
    refresh: '🔄 Refresh',
    importProfile: '📥 Import Profile',
    backupAll: '📦 Backup All',
    restoreBackup: '📤 Restore Backup',
    editProfile: 'Edit Profile',
    newProfileTitle: 'New Profile',
    name: 'Name',
    group: 'Group',
    groupPlaceholder: 'Client A',
    proxyType: 'Proxy Type',
    noProxy: 'No Proxy',
    proxyUsername: 'Proxy Username',
    proxyPassword: 'Proxy Password',
    proxyOptional: 'Proxy (optional)',
    usernameOptional: 'Username (optional)',
    passwordOptional: 'Password (optional)',
    cancel: 'Cancel',
    save: 'Save',
    create: 'Create',
    noProfiles: 'No profiles yet',
    noProfilesBody: 'Create your first browser profile to get started.',
    ungrouped: 'Ungrouped',
    close: 'Close',
    navigate: '🔗 Navigate',
    screenshot: '📷 Screenshot',
    open: 'Open',
    edit: 'Edit',
    export: 'Export',
    duplicate: 'Duplicate',
    delete: 'Delete',
    navigatePrompt: 'Enter URL to navigate:',
    navigating: '🔗 Navigating...',
    starting: 'Starting...',
    browserOpened: '✅ Browser opened',
    closed: 'Closed',
    saved: '✅ Saved',
    nameRequired: 'Enter a name',
    created: '✅ Created ',
    duplicated: '✅ Duplicated',
    deleteConfirm: 'Delete {name}?',
    deleted: 'Deleted',
    exporting: 'Exporting...',
    exportFailed: '❌ Export failed',
    exported: '✅ Exported',
    importing: 'Importing...',
    imported: '✅ Imported',
    backingUp: 'Backing up...',
    backupFailed: '❌ Backup failed',
    backedUp: '✅ Backed up',
    restoreConfirm: 'Restore will import all profiles without overwriting existing ones. Continue?',
    restoring: 'Restoring...',
    restored: '✅ Restored {count} profiles',
  },
  'zh-TW': {
    loginPrompt: '請輸入 API Token',
    loginOr: '或查看',
    invalidToken: 'Token 無效，請重新輸入',
    enterToken: '請輸入 Token',
    login: '登入',
    connecting: '連線中...',
    offline: '離線',
    newProfile: '+ 新增 Profile',
    refresh: '🔄 重新整理',
    importProfile: '📥 匯入 Profile',
    backupAll: '📦 全部備份',
    restoreBackup: '📤 還原備份',
    editProfile: '編輯 Profile',
    newProfileTitle: '新增 Profile',
    name: '名稱',
    group: '分組',
    groupPlaceholder: '客戶A',
    proxyType: 'Proxy 類型',
    noProxy: '無 Proxy',
    proxyUsername: 'Proxy 帳號',
    proxyPassword: 'Proxy 密碼',
    proxyOptional: 'Proxy (選填)',
    usernameOptional: '帳號 (選填)',
    passwordOptional: '密碼 (選填)',
    cancel: '取消',
    save: '儲存',
    create: '建立',
    noProfiles: '尚無 Profile',
    noProfilesBody: '建立你的第一個瀏覽器 Profile 開始使用',
    ungrouped: '未分組',
    close: '關閉',
    navigate: '🔗 導航',
    screenshot: '📷 截圖',
    open: '開啟',
    edit: '編輯',
    export: '匯出',
    duplicate: '複製',
    delete: '刪除',
    navigatePrompt: '輸入要導航的 URL：',
    navigating: '🔗 導航中...',
    starting: '啟動中...',
    browserOpened: '✅ 瀏覽器已開啟',
    closed: '已關閉',
    saved: '✅ 已儲存',
    nameRequired: '請輸入名稱',
    created: '✅ 已建立 ',
    duplicated: '✅ 已複製',
    deleteConfirm: '確定刪除 {name}？',
    deleted: '已刪除',
    exporting: '匯出中...',
    exportFailed: '❌ 匯出失敗',
    exported: '✅ 已匯出',
    importing: '匯入中...',
    imported: '✅ 已匯入',
    backingUp: '備份中...',
    backupFailed: '❌ 備份失敗',
    backedUp: '✅ 已備份',
    restoreConfirm: '還原備份會匯入所有 Profile（不會覆蓋現有的），確定？',
    restoring: '還原中...',
    restored: '✅ 已還原 {count} 個 Profile',
  },
};
let locale = localStorage.getItem('bf-locale') || (navigator.language === 'zh-TW' ? 'zh-TW' : 'en');
let TOKEN = '';
let profiles = [];
let sessions = new Set();
let screenshots = {}; // profileId → blob URL
let statusState = 'connecting';
let statusVersion = '';

function t(key, vars = {}) {
  let value = (LOCALES[locale] && LOCALES[locale][key]) || LOCALES.en[key] || key;
  for (const [name, replacement] of Object.entries(vars)) value = value.replace(`{${name}}`, replacement);
  return value;
}

function applyI18n() {
  document.documentElement.lang = locale;
  document.getElementById('langSelect').value = locale;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => { el.placeholder = t(el.dataset.i18nPlaceholder); });
  updateStatusText();
}

function updateStatusText() {
  const el = document.getElementById('status');
  if (!el) return;
  if (statusState === 'online') {
    el.textContent = '✅ v' + statusVersion;
  } else if (statusState === 'offline') {
    el.textContent = '❌ ' + t('offline');
  } else {
    el.textContent = t('connecting');
  }
}

// --- Login ---
async function init() {
  applyI18n();
  document.getElementById('langSelect').addEventListener('change', e => {
    locale = e.target.value;
    localStorage.setItem('bf-locale', locale);
    applyI18n();
    render();
  });
  TOKEN = location.hash.slice(1) || localStorage.getItem('bf-token') || localStorage.getItem('cmfx-token') || '';
  if (TOKEN) {
    const valid = await verifyToken(TOKEN);
    if (valid) {
      localStorage.setItem('bf-token', TOKEN);
      localStorage.removeItem('cmfx-token');
      showApp();
      return;
    }
  }
  document.getElementById('loginOverlay').style.display = 'flex';
}

async function verifyToken(token) {
  try {
    const r = await fetch(API + '/profiles', { headers: { 'Authorization': 'Bearer ' + token } });
    return r.status !== 401;
  } catch { return false; }
}

async function submitLogin() {
  const input = document.getElementById('loginToken');
  const err = document.getElementById('loginError');
  TOKEN = input.value.trim();
  if (!TOKEN) { err.style.display = 'block'; err.textContent = t('enterToken'); return; }
  const valid = await verifyToken(TOKEN);
  if (!valid) { err.style.display = 'block'; err.textContent = t('invalidToken'); return; }
  localStorage.setItem('bf-token', TOKEN);
  localStorage.removeItem('cmfx-token');
  showApp();
}

document.getElementById('loginToken').addEventListener('keydown', e => { if (e.key === 'Enter') submitLogin(); });

function showApp() {
  document.getElementById('loginOverlay').style.display = 'none';
  document.getElementById('toolbar').style.display = 'flex';
  checkStatus();
  loadProfiles();
  loadSessions();
  setInterval(loadSessions, 5000);
}

// --- API ---
async function api(method, path, body) {
  const opts = { method, headers: { 'Authorization': 'Bearer ' + TOKEN, 'Content-Type': 'application/json' } };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(API + path, opts);
  return r.json();
}

async function checkStatus() {
  try {
    const r = await fetch(API + '/status');
    const d = await r.json();
    statusState = 'online';
    statusVersion = d.version || '';
  } catch {
    statusState = 'offline';
    statusVersion = '';
  }
  updateStatusText();
}

async function loadProfiles() {
  const d = await api('GET', '/profiles');
  profiles = d.data || [];
  render();
}

async function loadSessions() {
  const d = await api('GET', '/sessions');
  sessions = new Set((d.data || []).map(s => s.profile_id));
  render();
}

function render() {
  const grid = document.getElementById('grid');

  // Empty state
  if (profiles.length === 0) {
    grid.innerHTML = `<div class="empty-state">
      <h2>${t('noProfiles')}</h2>
      <p>${t('noProfilesBody')}</p>
      <button class="primary" onclick="showCreate()">${t('newProfile')}</button>
    </div>`;
    return;
  }

  grid.innerHTML = profiles.map(p => {
    const active = sessions.has(p.id);
    const fp = p.fingerprint || {};
    return `<div class="card">
      <div class="name"><span class="badge ${active ? 'active' : 'inactive'}"></span>${esc(p.name)}</div>
      <div class="meta">
        <span class="engine ${p.engine}">${p.engine === 'chromium' ? '🌐 Chromium' : '🦊 Firefox'}</span>
        · ${esc(p.group || t('ungrouped'))}
        ${p.proxy ? ' · 🔒 ' + esc(p.proxy.host) : ''}
      </div>
      <div class="fp">
        <span>UA:</span> ${esc((fp['navigator.userAgent']||'').substring(0,60))}...<br>
        <span>Platform:</span> ${esc(fp['navigator.platform']||'N/A')}
        · <span>Screen:</span> ${fp['screen.width']||'?'}×${fp['screen.height']||'?'}
      </div>
      ${active ? `<img class="thumb" id="thumb-${p.id}" src="" style="display:none">` : ''}
      <div class="actions">
        ${active
          ? `<button class="danger" onclick="closeSession('${p.id}')">${t('close')}</button>
             <button onclick="navigateTo('${p.id}')">${t('navigate')}</button>
             <button onclick="loadScreenshot('${p.id}')">${t('screenshot')}</button>`
          : `<button class="primary" onclick="openSession('${p.id}')">${t('open')}</button>`}
        <button onclick="editProfile('${p.id}')">${t('edit')}</button>
        <button onclick="exportProfile('${p.id}','${esc(p.name)}')">${t('export')}</button>
        <button onclick="duplicateProfile('${p.id}')">${t('duplicate')}</button>
        <button onclick="deleteProfile('${p.id}','${esc(p.name)}')">${t('delete')}</button>
      </div>
    </div>`;
  }).join('');

  // Restore cached screenshots
  for (const pid in screenshots) {
    const img = document.getElementById('thumb-' + pid);
    if (img) { img.src = screenshots[pid]; img.style.display = 'block'; }
  }
}

// --- Navigate ---
function navigateTo(profileId) {
  const url = prompt(t('navigatePrompt'), 'https://');
  if (!url) return;
  api('POST', '/sessions/sess_' + profileId + '/navigate', { url });
  toast(t('navigating'));
}

// --- Screenshot preview ---
async function loadScreenshot(profileId) {
  try {
    const r = await fetch(API + '/sessions/sess_' + profileId + '/screenshot?quality=30', {
      headers: { 'Authorization': 'Bearer ' + TOKEN }
    });
    if (!r.ok) return;
    const blob = await r.blob();
    if (screenshots[profileId]) URL.revokeObjectURL(screenshots[profileId]);
    screenshots[profileId] = URL.createObjectURL(blob);
    const img = document.getElementById('thumb-' + profileId);
    if (img) { img.src = screenshots[profileId]; img.style.display = 'block'; }
  } catch {}
}

// --- Sessions ---
async function openSession(profileId) {
  toast(t('starting'));
  const d = await api('POST', '/sessions', { profile_id: profileId });
  if (d.error) { toast('❌ ' + d.error.message); return; }
  toast(t('browserOpened'));
  sessions.add(profileId);
  render();
}

async function closeSession(profileId) {
  await api('DELETE', '/sessions/sess_' + profileId);
  sessions.delete(profileId);
  render();
  toast(t('closed'));
}

// --- Profile CRUD ---
function showCreate() { document.getElementById('createModal').classList.add('show'); }
function hideCreate() { document.getElementById('createModal').classList.remove('show'); }
function hideEdit() { document.getElementById('editModal').classList.remove('show'); }

async function editProfile(id) {
  const p = profiles.find(x => x.id === id);
  if (!p) return;
  document.getElementById('e-id').value = p.id;
  document.getElementById('e-name').value = p.name || '';
  document.getElementById('e-group').value = p.group || '';
  document.getElementById('e-proxy-type').value = p.proxy?.type || '';
  document.getElementById('e-proxy-host').value = p.proxy?.host || '';
  document.getElementById('e-proxy-port').value = p.proxy?.port || '';
  document.getElementById('e-proxy-user').value = p.proxy?.username || '';
  document.getElementById('e-proxy-pass').value = p.proxy?.password || '';
  document.getElementById('editModal').classList.add('show');
}

async function saveProfile() {
  const id = document.getElementById('e-id').value;
  const body = { name: document.getElementById('e-name').value, group: document.getElementById('e-group').value || undefined };
  const proxyType = document.getElementById('e-proxy-type').value;
  if (proxyType) {
    body.proxy = { type: proxyType, host: document.getElementById('e-proxy-host').value, port: parseInt(document.getElementById('e-proxy-port').value) || 1080, username: document.getElementById('e-proxy-user').value || undefined, password: document.getElementById('e-proxy-pass').value || undefined };
  } else { body.proxy = null; }
  const d = await api('PUT', '/profiles/' + id, body);
  if (d.error) { toast('❌ ' + d.error.message); return; }
  hideEdit(); toast(t('saved')); await loadProfiles();
}

async function createProfile() {
  const name = document.getElementById('f-name').value;
  if (!name) { toast(t('nameRequired')); return; }
  const body = { name, engine: document.getElementById('f-engine').value, group: document.getElementById('f-group').value || undefined };
  const proxyType = document.getElementById('f-proxy-type').value;
  if (proxyType) {
    body.proxy = { type: proxyType, host: document.getElementById('f-proxy-host').value, port: parseInt(document.getElementById('f-proxy-port').value) || 1080, username: document.getElementById('f-proxy-user').value || undefined, password: document.getElementById('f-proxy-pass').value || undefined };
  }
  const d = await api('POST', '/profiles', body);
  if (d.error) { toast('❌ ' + d.error.message); return; }
  hideCreate(); toast(t('created') + name); await loadProfiles();
}

async function duplicateProfile(id) { await api('POST', '/profiles/' + id + '/duplicate'); toast(t('duplicated')); await loadProfiles(); }

async function deleteProfile(id, name) {
  if (!confirm(t('deleteConfirm', { name }))) return;
  await api('DELETE', '/profiles/' + id); toast(t('deleted')); await loadProfiles();
}

async function exportProfile(id, name) {
  toast(t('exporting'));
  const r = await fetch(API + '/profiles/' + id + '/export', { method: 'POST', headers: { 'Authorization': 'Bearer ' + TOKEN } });
  if (!r.ok) { toast(t('exportFailed')); return; }
  const blob = await r.blob();
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = (name || id) + '.zip'; a.click();
  toast(t('exported'));
}

function importProfile() { document.getElementById('importFile').click(); }
async function handleImport(input) {
  const file = input.files[0]; if (!file) return;
  toast(t('importing')); const fd = new FormData(); fd.append('file', file);
  const r = await fetch(API + '/profiles/import', { method: 'POST', headers: { 'Authorization': 'Bearer ' + TOKEN }, body: fd });
  const d = await r.json(); input.value = '';
  if (d.error) { toast('❌ ' + d.error.message); return; }
  toast(t('imported')); await loadProfiles();
}

async function backupAll() {
  toast(t('backingUp'));
  const r = await fetch(API + '/backup', { method: 'POST', headers: { 'Authorization': 'Bearer ' + TOKEN } });
  if (!r.ok) { toast(t('backupFailed')); return; }
  const blob = await r.blob();
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'browseforge-backup-' + new Date().toISOString().slice(0,10) + '.zip'; a.click();
  toast(t('backedUp'));
}

function restoreBackup() { document.getElementById('restoreFile').click(); }
async function handleRestore(input) {
  const file = input.files[0]; if (!file) return;
  if (!confirm(t('restoreConfirm'))) { input.value = ''; return; }
  toast(t('restoring')); const fd = new FormData(); fd.append('file', file);
  const r = await fetch(API + '/restore', { method: 'POST', headers: { 'Authorization': 'Bearer ' + TOKEN }, body: fd });
  const d = await r.json(); input.value = '';
  if (d.error) { toast('❌ ' + d.error.message); return; }
  toast(t('restored', { count: d.data.imported })); await loadProfiles();
}

function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 3000); }
function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

init();
</script>
</body>
