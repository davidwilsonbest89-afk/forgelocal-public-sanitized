services:
  browseforge:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.run
      args:
        BROWSEFORGE_VERSION: ${BROWSEFORGE_VERSION:-v1.7.7}
        BROWSEFORGE_ARCH: linux-x64
    ports:
      - "19280:19280"  # Dashboard + REST API
      - "6901:6901"    # KasmVNC web client
    volumes:
      - browseforge-profiles:/app/profiles
      - browseforge-data:/app/data
      - browseforge-browsers:/app/browsers
    environment:
      - VNC_PASSWORD=browseforge
    restart: unless-stopped

volumes:
  browseforge-profiles:
  browseforge-data:
  browseforge-browsers:
